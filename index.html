<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Game Day Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#07090d; --panel:#0e131b; --panel2:#131a25; --line:#1e2634;
  --ink:#f2f5f9; --muted:#8b95a7; --dim:#5b6577;
  --live:#ff3b30; --win:#00e676; --accent:#ffd60a; --espn:#d50a0a;
  --fd:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --fb:"Barlow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;min-height:100vh}
header.top{position:sticky;top:0;z-index:50;background:rgba(7,9,13,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-inner{max-width:720px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--fd);font-weight:900;font-style:italic;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand em{color:var(--accent);font-style:italic}
.brand small{display:block;font-family:var(--fb);font-style:normal;font-weight:600;font-size:10px;letter-spacing:.22em;color:var(--muted);margin-top:2px}
.datenav{margin-left:auto;display:flex;align-items:center;gap:6px}
.dbtn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;min-width:40px;min-height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dbtn:active{transform:scale(.94)}
#datelabel{font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:.06em;min-width:86px;text-align:center;color:var(--muted)}
#refreshbtn{position:relative}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.filters{max-width:720px;margin:0 auto;padding:10px 14px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--muted);font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.05em;padding:10px 16px;cursor:pointer;text-transform:uppercase}
.seg button.on{background:var(--ink);color:#000}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;min-height:40px}
.chip.on{border-color:var(--accent);color:var(--accent)}
#lastupd{margin-left:auto;font-size:11px;color:var(--dim)}
main{max-width:720px;margin:0 auto;padding:6px 14px 90px}
.sec-h{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font-family:var(--fd);font-weight:800;font-size:19px;letter-spacing:.05em;text-transform:uppercase}
.sec-h .n{background:var(--panel2);border:1px solid var(--line);border-radius:6px;font-size:12px;padding:2px 8px;color:var(--muted);font-family:var(--fb)}
.livedot{width:9px;height:9px;border-radius:50%;background:var(--live);animation:bl 1.2s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
/* pinned multi-view */
#pinnedwrap{margin-top:12px}
.pin-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:560px){.pin-grid{grid-template-columns:1fr 1fr}}
.pincard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px;position:relative}
.pincard .pt{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinrow{display:flex;align-items:center;gap:8px;padding:3px 0}
.pinrow img{width:26px;height:26px;object-fit:contain}
.pinrow .pa{font-family:var(--fd);font-weight:800;font-size:18px;width:52px}
.pinrow .ps{margin-left:auto;font-family:var(--fd);font-weight:800;font-size:22px}
.pinmeta{display:flex;align-items:center;gap:6px;margin-top:8px}
.pinwatch{flex:1;background:var(--espn);color:#fff;border:0;border-radius:8px;font-weight:700;font-size:14px;padding:10px;cursor:pointer;min-height:44px}
.pinun{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.5);border:1px solid var(--line);color:var(--muted);border-radius:6px;width:30px;height:30px;font-size:14px;cursor:pointer}
/* game cards */
.g{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.g-top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.g-top .net{margin-left:auto;color:var(--dim);letter-spacing:.04em}
.g-top .lg{font-family:var(--fd);font-size:13px;color:var(--dim)}
.trow{display:flex;align-items:center;gap:10px;padding:9px 12px;position:relative}
.trow+.trow{border-top:1px solid var(--line)}
.trow .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.trow img{width:34px;height:34px;object-fit:contain;flex:none}
.tinfo{flex:1;min-width:0}
.tname{font-family:var(--fd);font-weight:800;font-size:19px;letter-spacing:.02em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tname .rk{color:var(--accent);font-size:15px;margin-right:4px}
.trec{font-size:11px;color:var(--dim);font-weight:600}
.tscore{font-family:var(--fd);font-weight:900;font-size:30px;min-width:44px;text-align:right}
.tscore.winner{color:var(--win)}
.g-bot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:stretch}
.clock{flex:1;display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:16px;color:var(--accent);letter-spacing:.04em}
.clock.final{color:var(--muted)}
.watchbtn{flex:1.4;background:var(--espn);color:#fff;border:0;border-radius:9px;font-weight:700;font-size:15px;cursor:pointer;min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.watchbtn:active{transform:scale(.97)}
.pinbtn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:9px;min-width:52px;min-height:46px;font-size:18px;cursor:pointer}
.pinbtn.pinned{color:var(--accent);border-color:var(--accent)}
.closeflag{display:inline-block;background:var(--live);color:#fff;font-size:10px;font-weight:800;letter-spacing:.1em;border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.upd{font-size:12px;color:var(--dim);padding:2px 0 0}
.empty{text-align:center;color:var(--dim);padding:36px 10px;font-size:14px}
.empty .big{font-family:var(--fd);font-size:26px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.loading{text-align:center;padding:40px;color:var(--dim)}
footer.tab{position:fixed;bottom:0;left:0;right:0;background:rgba(7,9,13,.95);border-top:1px solid var(--line);backdrop-filter:blur(10px);z-index:50}
.tab-inner{max-width:720px;margin:0 auto;display:flex;padding:8px 14px calc(8px + env(safe-area-inset-bottom));gap:8px}
.tabbtn{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:12px 4px;font-family:var(--fd);font-weight:700;font-size:14px;letter-spacing:.05em;cursor:pointer;text-transform:uppercase;min-height:48px}
.tabbtn.on{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><em>Game Day</em> Command<small>MISSION CONTROL</small></div>
    <div class="datenav">
      <button class="dbtn" id="prevday" aria-label="Previous day">&#8592;</button>
      <div id="datelabel">TODAY</div>
      <button class="dbtn" id="nextday" aria-label="Next day">&#8594;</button>
      <button class="dbtn" id="refreshbtn" aria-label="Refresh">&#8635;</button>
    </div>
  </div>
</header>
<div class="filters">
  <div class="seg" id="leagueseg">
    <button data-lg="all" class="on">All</button>
    <button data-lg="cfb">CFB</button>
    <button data-lg="nfl">NFL</button>
  </div>
  <button class="chip" id="f-ranked">&#9733; Ranked</button>
  <button class="chip" id="f-close">&#128293; Close</button>
  <button class="chip" id="f-live">Live only</button>
  <span id="lastupd"></span>
</div>
<main>
  <div id="pinnedwrap" hidden>
    <div class="sec-h"><span style="color:var(--accent)">&#9733;</span> Pinned Multi-View <span class="n" id="pincount"></span></div>
    <div class="pin-grid" id="pingrid"></div>
  </div>
  <div id="content"><div class="loading">Loading games&hellip;</div></div>
</main>
<footer class="tab">
  <div class="tab-inner">
    <button class="tabbtn on" data-view="all">Games</button>
    <button class="tabbtn" data-view="pinned">Multi-View <span id="tabpincount"></span></button>
  </div>
</footer>
<script>
"use strict";
const $=s=>document.querySelector(s);
const state={league:"all",ranked:false,close:false,liveOnly:false,view:"all",
  date:todayKey(),games:[],pins:JSON.parse(localStorage.getItem("gd_pins")||"[]"),loading:true};
function todayKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function keyToLabel(k){const t=todayKey();if(k===t)return"TODAY";if(k===t-1)return"YESTERDAY";if(k===t+1)return"TOMORROW";
  const s=String(k),d=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8));
  return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}).toUpperCase();}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

async function fetchLeague(path){
  const url=`https://site.api.espn.com/apis/site/v2/sports/football/${path}/scoreboard?dates=${state.date}&limit=200`;
  const r=await fetch(url); if(!r.ok)throw new Error("espn "+r.status);
  return r.json();
}
function parseGame(e,league){
  const comp=e.competitions[0]||{};
  const st=e.status.type;
  const stateName=st.state; // pre | in | post
  const teams={};
  for(const c of comp.competitors||[]){
    const t=c.team||{};
    teams[c.homeAway==="home"?"home":"away"]={
      abbr:t.abbreviation||"",name:(t.displayName||t.shortDisplayName||""),
      logo:(t.logos&&t.logos[0]&&t.logos[0].href)||"",
      color:"#"+(t.color||"888888"),alt:"#"+(t.alternateColor||"222222"),
      score:c.score==null?null:parseInt(c.score,10),
      rank:(c.curatedRank&&c.curatedRank.current<=25)?c.curatedRank.current:null,
      record:(c.records&&c.records[0]&&c.records[0].summary)||"",
      winner:!!c.winner
    };
  }
  let watch=null;
  for(const l of e.links||[]){ if(/watch/i.test(l.text||"")||/watch/i.test(l.shortText||"")){watch=l.href;break;} }
  if(!watch){const gc=(e.links||[]).find(l=>/gamecast/i.test(l.text||"")); watch=gc?gc.href:null;}
  const nets=[]; for(const b of comp.broadcasts||[]){for(const n of b.names||[])if(!nets.includes(n))nets.push(n);}
  return {id:e.id,league,away:teams.away,home:teams.home,
    live:stateName==="in",pre:stateName==="pre",post:stateName==="post",
    clock:st.shortDetail||"",period:comp.status&&comp.status.period||0,
    net:nets.slice(0,3).join(" / ")||"",watch,
    date:e.date?new Date(e.date):null,
    note:(comp.notes&&comp.notes[0]&&comp.notes[0].headline)||""};
}
async function load(){
  state.loading=true; render();
  $("#refreshbtn").classList.add("spin");
  try{
    const[cfb,nfl]=await Promise.all([fetchLeague("college-football"),fetchLeague("nfl")]);
    const g=[];
    for(const e of cfb.events||[])g.push(parseGame(e,"cfb"));
    for(const e of nfl.events||[])g.push(parseGame(e,"nfl"));
    state.games=g;
    // drop pins for games not present
    const ids=new Set(g.map(x=>x.id));
    state.pins=state.pins.filter(p=>ids.has(p));
    savePins();
  }catch(err){ state.err="Couldn't reach ESPN. Pull to retry."; }
  state.loading=false;
  $("#refreshbtn").classList.remove("spin");
  $("#lastupd").textContent="Updated "+new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  render();
}
function savePins(){localStorage.setItem("gd_pins",JSON.stringify(state.pins));}
function togglePin(id){
  const i=state.pins.indexOf(id);
  if(i>=0)state.pins.splice(i,1);
  else{if(state.pins.length>=4){alert("Max 4 pinned games");return;}state.pins.push(id);}
  savePins();render();
}
function filtered(){
  let g=state.games.slice();
  if(state.league!=="all")g=g.filter(x=>x.league===state.league);
  if(state.ranked)g=g.filter(x=>x.league==="nfl"||x.away.rank||x.home.rank);
  if(state.liveOnly)g=g.filter(x=>x.live);
  if(state.close)g=g.filter(x=>x.live&&x.period>=4&&x.away.score!=null&&x.home.score!=null&&Math.abs(x.away.score-x.home.score)<=8);
  const ord=x=>x.live?0:x.pre?1:2;
  g.sort((a,b)=>ord(a)-ord(b)||((a.date||0)-(b.date||0)));
  return g;
}
function teamRow(t,pos){
  return `<div class="trow"><span class="bar" style="background:${esc(t.color)}"></span>
    ${t.logo?`<img src="${esc(t.logo)}" alt="" loading="lazy" onerror="this.style.display='none'">`:""}
    <div class="tinfo"><div class="tname">${t.rank?`<span class="rk">${t.rank}</span>`:""}${esc(t.abbr)}</div>
    <div class="trec">${esc(t.record)}${t.name?" &middot; "+esc(t.name):""}</div></div>
    <div class="tscore ${t.winner?"winner":""}">${t.score==null?"&ndash;":t.score}</div></div>`;
}
function isClose(g){return g.live&&g.period>=4&&g.away.score!=null&&g.home.score!=null&&Math.abs(g.away.score-g.home.score)<=8;}
function card(g){
  const pinned=state.pins.includes(g.id);
  const kick=g.pre&&g.date?g.date.toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit"}):"";
  return `<div class="g" id="g-${g.id}">
    <div class="g-top">${g.live?'<span class="livedot"></span><span style="color:var(--live)">LIVE</span>':(g.post?'<span>FINAL</span>':'<span>UPCOMING</span>')}
      ${isClose(g)?'<span class="closeflag">CLOSE</span>':""}
      <span class="lg">${g.league==="cfb"?"CFB":"NFL"}</span>
      <span class="net">${esc(g.net)}</span></div>
    ${teamRow(g.away,"a")}${teamRow(g.home,"h")}
    <div class="g-bot">
      <div class="clock ${g.post?"final":""}">${g.live?esc(g.clock):(g.post?esc(g.clock||"Final"):esc(kick))}</div>
      ${g.watch?`<a class="watchbtn" href="${esc(g.watch)}" target="_blank" rel="noopener">&#9654; Watch</a>`:""}
      <button class="pinbtn ${pinned?"pinned":""}" data-pin="${g.id}" aria-label="Pin game">${pinned?"&#9733;":"&#9734;"}</button>
    </div>
    ${g.note?`<div class="upd" style="padding:0 12px 10px">${esc(g.note)}</div>`:""}
  </div>`;
}
function render(){
  $("#datelabel").textContent=keyToLabel(state.date);
  document.querySelectorAll("#leagueseg button").forEach(b=>b.classList.toggle("on",b.dataset.lg===state.league));
  $("#f-ranked").classList.toggle("on",state.ranked);
  $("#f-close").classList.toggle("on",state.close);
  $("#f-live").classList.toggle("on",state.liveOnly);
  document.querySelectorAll(".tabbtn").forEach(b=>b.classList.toggle("on",b.dataset.view===state.view));
  $("#tabpincount").textContent=state.pins.length?`(${state.pins.length})`:"";
  // pinned multi-view
  const pw=$("#pinnedwrap");
  if(state.pins.length){
    pw.hidden=false;$("#pincount").textContent=state.pins.length+" / 4";
    $("#pingrid").innerHTML=state.pins.map(id=>{
      const g=state.games.find(x=>x.id===id);if(!g)return"";
      return `<div class="pincard">
        <button class="pinun" data-pin="${g.id}">&times;</button>
        <div class="pt">${g.live?'<span style="color:var(--live)">&#9679; LIVE</span> ':''}${esc(g.away.abbr)} @ ${esc(g.home.abbr)} &middot; ${esc(g.net)}</div>
        <div class="pinrow"><img src="${esc(g.away.logo)}" onerror="this.style.display='none'" alt=""><span class="pa">${esc(g.away.abbr)}</span><span class="ps">${g.away.score==null?"&ndash;":g.away.score}</span></div>
        <div class="pinrow"><img src="${esc(g.home.logo)}" onerror="this.style.display='none'" alt=""><span class="pa">${esc(g.home.abbr)}</span><span class="ps">${g.home.score==null?"&ndash;":g.home.score}</span></div>
        <div class="pinmeta"><span style="font-size:12px;color:var(--accent);font-weight:700">${esc(g.live?g.clock:(g.post?"FINAL":(g.date?g.date.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}):"")))}</span>
        ${g.watch?`<a class="pinwatch" style="text-align:center;text-decoration:none" href="${esc(g.watch)}" target="_blank" rel="noopener">&#9654; Watch</a>`:""}</div>
      </div>`;
    }).join("");
  }else pw.hidden=true;
  // main content
  const c=$("#content");
  if(state.loading){c.innerHTML='<div class="loading">Loading games&hellip;</div>';return;}
  if(state.err&&!state.games.length){c.innerHTML=`<div class="empty"><div class="big">No signal</div>${esc(state.err)}<br><br><button class="chip" onclick="load()">Retry</button></div>`;return;}
  let g=filtered();
  if(state.view==="pinned"){
    g=g.filter(x=>state.pins.includes(x.id));
    if(!g.length){c.innerHTML='<div class="empty"><div class="big">No pinned games</div>Tap the &#9734; on any game to pin it here for multi-view.<br>Pin up to 4.</div>';return;}
  }
  const live=g.filter(x=>x.live),up=g.filter(x=>x.pre),fin=g.filter(x=>x.post);
  let h="";
  if(live.length)h+=`<div class="sec-h"><span class="livedot"></span> Live <span class="n">${live.length}</span></div>`+live.map(card).join("");
  if(up.length)h+=`<div class="sec-h">Upcoming <span class="n">${up.length}</span></div>`+up.map(card).join("");
  if(fin.length&&!state.liveOnly)h+=`<div class="sec-h">Final <span class="n">${fin.length}</span></div>`+fin.map(card).join("");
  if(!h)h='<div class="empty"><div class="big">No games</div>Nothing matches these filters. Try another day.</div>';
  c.innerHTML=h;
}
// events
document.addEventListener("click",e=>{
  const p=e.target.closest("[data-pin]");
  if(p){togglePin(p.dataset.pin);return;}
  const v=e.target.closest(".tabbtn");
  if(v){state.view=v.dataset.view;render();}
});
$("#leagueseg").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  state.league=b.dataset.lg;state.view="all";render();
});
$("#f-ranked").onclick=()=>{state.ranked=!state.ranked;render();};
$("#f-close").onclick=()=>{state.close=!state.close;render();};
$("#f-live").onclick=()=>{state.liveOnly=!state.liveOnly;render();};
$("#refreshbtn").onclick=()=>load();
$("#prevday").onclick=()=>{const s=String(state.date);const d=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8));d.setDate(d.getDate()-1);state.date=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();load();};
$("#nextday").onclick=()=>{const s=String(state.date);const d=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8));d.setDate(d.getDate()+1);state.date=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();load();};
load();
setInterval(load,30000);
</script>
</body>
</html>
